services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: cloudprofile-backend:1.0.0
    container_name: cloudprofile-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: cloudprofile-frontend:1.0.0
    container_name: cloudprofile-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
